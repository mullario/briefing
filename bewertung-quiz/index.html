<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewertungsrecht-Training</title>
<style>
  :root {
    --bg: #f4f3ef;
    --card: #ffffff;
    --fg: #1d1d1f;
    --muted: #6b6b72;
    --border: #e2e0da;
    --accent: #3b5bdb;
    --accent-fg: #ffffff;
    --ok: #2b8a3e;
    --ok-bg: #e6f4ea;
    --bad: #c92a2a;
    --bad-bg: #fdecec;
    --hint-bg: #f1f3fb;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214;
      --card: #1c1c1f;
      --fg: #ececf0;
      --muted: #9b9ba3;
      --border: #2e2e33;
      --accent: #7b93ff;
      --accent-fg: #0d0d10;
      --ok: #69db7c;
      --ok-bg: #16301d;
      --bad: #ff8787;
      --bad-bg: #3a1a1a;
      --hint-bg: #1f2233;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121214; --card: #1c1c1f; --fg: #ececf0; --muted: #9b9ba3; --border: #2e2e33;
    --accent: #7b93ff; --accent-fg: #0d0d10; --ok: #69db7c; --ok-bg: #16301d;
    --bad: #ff8787; --bad-bg: #3a1a1a; --hint-bg: #1f2233; --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header.top h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
  .menu-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 6px 12px; font-size: .9rem; cursor: pointer;
  }
  .menu-btn:hover { color: var(--fg); }

  .progress { margin-bottom: 18px; }
  .progress-bar { height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--ok); border-radius: 99px; width: 0; transition: width .5s ease; }
  .progress-text { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; gap: 8px; flex-wrap: wrap; }
  .progress-text b { color: var(--fg); font-variant-numeric: tabular-nums; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 22px 20px; box-shadow: var(--shadow);
  }
  @media (max-width: 520px) { .card { padding: 18px 16px; border-radius: 14px; } }

  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .badge {
    font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px;
    background: var(--hint-bg); color: var(--accent);
  }
  .badge.retry { background: var(--bad-bg); color: var(--bad); }
  .question { font-size: 1.08rem; font-weight: 600; margin: 0 0 6px; white-space: pre-line; }
  .hint { font-size: .85rem; color: var(--muted); margin: 0 0 16px; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    text-align: left; font: inherit; color: inherit;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .box {
    flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px;
    border: 2px solid var(--muted); display: grid; place-items: center;
    font-size: 14px; font-weight: 700; color: var(--accent-fg);
  }
  .opt.sel { border-color: var(--accent); background: var(--hint-bg); }
  .opt.sel .box { background: var(--accent); border-color: var(--accent); }
  .letter { font-weight: 700; color: var(--muted); flex: 0 0 auto; min-width: 1.2em; }
  .opt-text { flex: 1 1 auto; }
  .marks { flex: 0 0 auto; display: flex; gap: 4px; margin-left: 4px; }
  .mark {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; line-height: 1;
  }
  .mark.ok { background: var(--ok); color: var(--card); }
  .mark.bad { background: var(--bad); color: var(--card); }

  /* Auswertungszustände */
  .opt.r-ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.r-bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.r-ok.sel .box { background: var(--ok); border-color: var(--ok); }
  .opt.r-bad.sel .box { background: var(--bad); border-color: var(--bad); }
  .opt.r-neutral { opacity: .75; }
  .opt.r-neutral.sel .box { background: var(--muted); border-color: var(--muted); }

  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .btn {
    font: inherit; font-weight: 600; border: none; border-radius: 12px; cursor: pointer;
    padding: 12px 20px; background: var(--accent); color: var(--accent-fg);
  }
  .btn:hover { filter: brightness(1.07); }
  .btn.secondary { background: transparent; color: var(--fg); border: 1.5px solid var(--border); }
  .btn.danger { background: var(--bad); color: var(--card); }
  .kbd { font-size: .78rem; color: var(--muted); }

  .verdict {
    margin-top: 18px; padding: 12px 14px; border-radius: 12px; font-weight: 600;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .legend { font-size: .82rem; color: var(--muted); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .mark { width: 20px; height: 20px; font-size: 12px; }
  .explain {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--hint-bg);
    font-size: .93rem;
  }
  .explain strong { display: block; margin-bottom: 4px; }

  .center { text-align: center; }
  .big { font-size: 3rem; margin: 6px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat .n { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .8rem; color: var(--muted); }
  .muted { color: var(--muted); }
  .hard { margin: 8px 0 0; padding-left: 20px; font-size: .9rem; }
  .hard li { margin-bottom: 4px; }
  dialog {
    border: 1px solid var(--border); border-radius: 16px; background: var(--card); color: var(--fg);
    padding: 20px; max-width: 420px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .src-list { font-size: .85rem; color: var(--muted); margin: 10px 0 0; padding-left: 18px; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.15) } 100% { transform: scale(1); opacity: 1 } }
  .mark { animation: pop .25s ease-out both; }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } .progress-fill { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🏠 Bewertungsrecht-Training</h1>
    <button class="menu-btn" id="menuBtn" type="button">Menü</button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
    <div class="progress-text">
      <span><b id="pDone">0</b> von <b id="pTotal">0</b> Fragen gemeistert</span>
      <span>noch offen: <b id="pOpen">0</b></span>
    </div>
  </div>

  <main id="app" class="card"></main>
</div>

<dialog id="menu">
  <h2>Menü</h2>
  <p class="muted" style="margin:0 0 14px;font-size:.9rem">Dein Fortschritt wird automatisch in diesem Browser gespeichert.</p>
  <div class="actions" style="margin-top:0">
    <button class="btn secondary" id="mStats" type="button">Statistik</button>
    <button class="btn danger" id="mReset" type="button">Fortschritt zurücksetzen</button>
    <button class="btn secondary" id="mClose" type="button">Schließen</button>
  </div>
  <ul class="src-list" id="srcList"></ul>
</dialog>

<script src="fragen.js"></script>
<script>
(function () {
  "use strict";

  const STORE_KEY = "bewertungsrecht-quiz-v1";
  const LETTERS = ["A", "B", "C", "D", "E", "F", "G"];
  const byId = new Map(FRAGEN.map(f => [f.id, f]));
  const app = document.getElementById("app");

  // ---------- Speicher ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* privater Modus o. ä. */ }
    return null;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorieren */ }
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function freshState() {
    return { v: 1, mastered: {}, queue: shuffle(FRAGEN.map(f => f.id)), tries: {}, wrong: {}, answers: 0, firstTry: 0, current: null };
  }

  let state = load() || freshState();
  let started = false; // Startbildschirm bei jedem Öffnen
  // Fragenkatalog kann sich ändern: Warteschlange abgleichen
  (function reconcile() {
    state.mastered = state.mastered || {};
    state.tries = state.tries || {};
    state.wrong = state.wrong || {};
    const inQueue = new Set();
    state.queue = (state.queue || []).filter(id => {
      if (!byId.has(id) || state.mastered[id] || inQueue.has(id)) return false;
      inQueue.add(id); return true;
    });
    const missing = FRAGEN.map(f => f.id).filter(id => !state.mastered[id] && !inQueue.has(id));
    state.queue.push(...shuffle(missing));
    if (state.current && (!byId.has(state.current.id) || (!state.current.done && state.current.id !== state.queue[0]))) {
      state.current = null;
    }
    save();
  })();

  // ---------- Fortschrittsanzeige ----------
  function masteredCount() { return FRAGEN.filter(f => state.mastered[f.id]).length; }
  function updateProgress() {
    const total = FRAGEN.length, done = masteredCount();
    document.getElementById("pDone").textContent = done;
    document.getElementById("pTotal").textContent = total;
    document.getElementById("pOpen").textContent = total - done;
    document.getElementById("pFill").style.width = (total ? (done / total * 100) : 0) + "%";
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Bildschirme ----------
  function render() {
    updateProgress();
    if (state.queue.length === 0 && !(state.current && state.current.done)) return renderDone();
    if (!started) return renderStart();
    if (!state.current) {
      state.current = { id: state.queue[0], sel: [], done: false };
      save();
    }
    renderQuestion();
  }

  function renderStart() {
    const done = masteredCount(), total = FRAGEN.length;
    const returning = state.answers > 0;
    app.innerHTML = `
      <div class="center">
        <div class="big">📚</div>
        <h2 style="margin:0 0 6px">${returning ? "Willkommen zurück!" : "Bereit zum Üben?"}</h2>
        <p class="muted" style="margin:0 auto;max-width:520px">
          ${returning
            ? `Du hast schon <b>${done}</b> von ${total} Fragen gemeistert. Es geht genau dort weiter, wo du aufgehört hast.`
            : `${total} Fragen zu Bewertungsrecht und Erbschaftsteuer. Bei jeder Frage können eine oder mehrere Antworten richtig sein. Komplett richtig beantwortete Fragen verschwinden, falsch beantwortete kommen später noch einmal.`}
        </p>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="go" type="button">${returning ? "Weiter üben" : "Los geht's"}</button>
      </div>`;
    document.getElementById("go").onclick = () => { started = true; render(); };
    document.getElementById("go").focus();
  }

  function renderQuestion() {
    const cur = state.current;
    const f = byId.get(cur.id);
    const tries = state.tries[f.id] || 0;
    const multi = f.o.length > 2;
    const isRF = f.o.length === 2 && f.o[0] === "Richtig";

    let html = `<div class="meta">
        <span class="badge">${esc(QUELLEN[f.s] || f.s)}</span>
        ${(state.wrong[f.id] || 0) > 0 ? `<span class="badge retry">Wiederholung · ${state.wrong[f.id]}× falsch</span>` : ""}
      </div>
      <p class="question">${esc(f.q)}</p>
      <p class="hint">${isRF ? "Ist die Aussage richtig oder falsch?" : (multi ? "Eine oder mehrere Antworten können richtig sein." : "Wähle die richtige Antwort.")}</p>
      <ul class="options" role="group">`;

    f.o.forEach((text, i) => {
      const sel = cur.sel.includes(i);
      let cls = "opt" + (sel ? " sel" : "");
      let marks = "";
      if (cur.done) {
        const correct = f.a.includes(i);
        const userRight = sel === correct;
        if (correct && userRight) cls += " r-ok";
        else if (!userRight) cls += " r-bad";
        else cls += " r-neutral";
        if (correct) marks += `<span class="mark ok" title="richtige Antwort" aria-label="richtige Antwort">✓</span>`;
        if (!userRight) marks += `<span class="mark bad" title="von dir falsch beantwortet" aria-label="von dir falsch beantwortet">✗</span>`;
      }
      html += `<li><button type="button" class="${cls}" data-i="${i}" ${cur.done ? "disabled" : ""} aria-pressed="${sel}">
          <span class="box">${sel ? "✓" : ""}</span>
          <span class="letter">${isRF ? "" : LETTERS[i] + "."}</span>
          <span class="opt-text">${esc(text)}</span>
          <span class="marks">${marks}</span>
        </button></li>`;
    });
    html += `</ul>`;

    if (!cur.done) {
      html += `<div class="actions">
          <button class="btn" id="check" type="button">Auswerten</button>
          <span class="kbd">Tasten: ${isRF ? "1–2" : "1–" + f.o.length} zum Ankreuzen, Enter zum Auswerten</span>
        </div>`;
    } else {
      const allRight = cur.result === true;
      html += `<div class="verdict ${allRight ? "ok" : "bad"}">
          <span>${allRight ? "🎉" : "🔁"}</span>
          <span>${allRight
            ? "Komplett richtig! Diese Frage ist erledigt und wird nicht mehr abgefragt."
            : (state.queue.length > 1
                ? "Nicht ganz. Diese Frage kommt später noch einmal – aber nicht sofort."
                : "Nicht ganz. Das ist die letzte offene Frage – sie kommt gleich noch einmal.")}</span>
        </div>
        <div class="legend">
          <span><span class="mark ok">✓</span> richtige Antwort</span>
          <span><span class="mark bad">✗</span> von dir falsch beantwortet</span>
        </div>
        ${f.e ? `<div class="explain"><strong>Erklärung</strong>${esc(f.e)}</div>` : ""}
        <div class="actions">
          <button class="btn" id="next" type="button">${state.queue.length ? "Nächste Frage" : "Zum Abschluss"}</button>
          <span class="kbd">Enter = weiter</span>
        </div>`;
    }
    app.innerHTML = html;

    if (!cur.done) {
      app.querySelectorAll(".opt").forEach(btn => {
        btn.onclick = () => toggle(+btn.dataset.i);
      });
      document.getElementById("check").onclick = evaluate;
    } else {
      const nb = document.getElementById("next");
      nb.onclick = next;
      nb.focus({ preventScroll: true });
    }
  }

  function toggle(i) {
    const cur = state.current;
    if (!cur || cur.done) return;
    const f = byId.get(cur.id);
    if (i < 0 || i >= f.o.length) return;
    const isRF = f.o.length === 2 && f.o[0] === "Richtig";
    if (isRF) cur.sel = [i];
    else cur.sel = cur.sel.includes(i) ? cur.sel.filter(x => x !== i) : [...cur.sel, i].sort();
    save();
    renderQuestion();
  }

  function evaluate() {
    const cur = state.current;
    if (!cur || cur.done) return;
    const f = byId.get(cur.id);
    const sel = new Set(cur.sel);
    const correct = f.a.length === sel.size && f.a.every(i => sel.has(i));
    const firstAttempt = !(state.tries[f.id] > 0);

    state.tries[f.id] = (state.tries[f.id] || 0) + 1;
    state.answers++;
    cur.done = true;
    cur.result = correct;

    // aus der Warteschlange nehmen (sie steht vorne)
    state.queue = state.queue.filter(id => id !== f.id);
    if (correct) {
      state.mastered[f.id] = true;
      if (firstAttempt) state.firstTry++;
    } else {
      state.wrong[f.id] = (state.wrong[f.id] || 0) + 1;
      // nicht direkt wieder: mindestens 3 andere Fragen dazwischen (sofern vorhanden)
      const minGap = 3, spread = 4;
      const pos = Math.min(state.queue.length, minGap + Math.floor(Math.random() * spread));
      state.queue.splice(pos, 0, f.id);
    }
    save();
    updateProgress();
    renderQuestion();
  }

  function next() {
    state.current = null;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function hardest(n) {
    return Object.entries(state.wrong)
      .filter(([id]) => byId.has(id))
      .sort((a, b) => b[1] - a[1])
      .slice(0, n);
  }

  function statsHtml() {
    const done = masteredCount();
    const rate = state.answers ? Math.round(done / state.answers * 100) : 0;
    const hard = hardest(5);
    return `<div class="stats">
        <div class="stat"><div class="n">${done}/${FRAGEN.length}</div><div class="l">gemeistert</div></div>
        <div class="stat"><div class="n">${state.answers}</div><div class="l">Antworten insgesamt</div></div>
        <div class="stat"><div class="n">${state.firstTry}</div><div class="l">beim 1. Versuch richtig</div></div>
        <div class="stat"><div class="n">${rate}%</div><div class="l">Trefferquote</div></div>
      </div>
      ${hard.length ? `<p style="margin:0;font-weight:600">Deine kniffligsten Fragen</p>
        <ol class="hard">${hard.map(([id, n]) => {
          const f = byId.get(id);
          const q = f.q.length > 110 ? f.q.slice(0, 107) + "…" : f.q;
          return `<li>${esc(q)} <span class="muted">(${n}× falsch)</span></li>`;
        }).join("")}</ol>` : ""}`;
  }

  function renderDone() {
    app.innerHTML = `
      <div class="center">
        <div class="big">🏆</div>
        <h2 style="margin:0 0 6px">Geschafft!</h2>
        <p class="muted" style="margin:0">Du hast alle ${FRAGEN.length} Fragen richtig beantwortet. Stark!</p>
      </div>
      ${statsHtml()}
      <div class="actions" style="justify-content:center">
        <button class="btn" id="again" type="button">Nochmal von vorne</button>
      </div>`;
    document.getElementById("again").onclick = () => { state = freshState(); started = true; save(); render(); };
  }

  function renderStats() {
    const back = state.queue.length ? "Zurück zur Frage" : "Zurück";
    app.innerHTML = `<h2 style="margin:0 0 4px;font-size:1.15rem">Statistik</h2>${statsHtml()}
      <div class="actions"><button class="btn" id="back" type="button">${back}</button></div>`;
    document.getElementById("back").onclick = render;
  }

  // ---------- Menü ----------
  const menu = document.getElementById("menu");
  document.getElementById("srcList").innerHTML = Object.entries(QUELLEN).map(([k, v]) =>
    `<li>${esc(v)}: ${FRAGEN.filter(f => f.s === k).length} Fragen</li>`).join("");
  document.getElementById("menuBtn").onclick = () => menu.showModal ? menu.showModal() : menu.setAttribute("open", "");
  document.getElementById("mClose").onclick = () => menu.close();
  document.getElementById("mStats").onclick = () => { menu.close(); renderStats(); };
  document.getElementById("mReset").onclick = () => {
    if (confirm("Wirklich den gesamten Fortschritt löschen und von vorne beginnen?")) {
      state = freshState();
      save();
      menu.close();
      render();
    }
  };

  // ---------- Tastatur ----------
  document.addEventListener("keydown", e => {
    if (menu.open || e.metaKey || e.ctrlKey || e.altKey) return;
    const cur = state.current;
    if (e.key === "Enter") {
      const b = document.getElementById("check") || document.getElementById("next") || document.getElementById("go");
      if (b && document.activeElement !== b) { e.preventDefault(); b.click(); }
      return;
    }
    if (!cur || cur.done) return;
    const k = e.key.toUpperCase();
    let i = -1;
    if (/^[1-9]$/.test(k)) i = +k - 1;
    else if (/^[A-E]$/.test(k)) i = k.charCodeAt(0) - 65;
    if (i >= 0) { e.preventDefault(); toggle(i); }
  });

  render();
})();
</script>
</body>
</html>
